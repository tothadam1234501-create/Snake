<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Deluxe - Battle Pass, Shop & Leaderboard</title>
    <style>
        :root {
            --primary: #4CAF50;
            --primary-glow: rgba(76, 175, 80, 0.4);
            --gold: #f1c40f;
            --accent: #00d2d3;
            --bg-dark: #0f1115;
            --panel-bg: rgba(26, 30, 38, 0.85);
        }

        body {
            /* Carbon-Fiber (szénszálas) háttértextúra */
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 0),
                linear-gradient(45deg, #13161c 25%, transparent 25%, transparent 75%, #13161c 75%, #13161c),
                linear-gradient(45deg, #13161c 25%, transparent 25%, transparent 75%, #13161c 75%, #13161c);
            background-size: 20px 20px, 10px 10px, 10px 10px;
            background-position: 0 0, 0 0, 5px 5px;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        h1 { 
            margin-bottom: 5px; 
            text-shadow: 0 0 10px var(--primary-glow), 0 2px 4px rgba(0,0,0,0.8);
            letter-spacing: 1px;
        }

        .player-tag {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 15px;
        }

        .player-tag span {
            color: var(--primary);
            font-weight: bold;
            cursor: pointer;
            text-decoration: underline;
            text-shadow: 0 0 5px var(--primary-glow);
        }

        /* Glassmorphism Panel Kialakítás szálcsiszolt textúrával */
        .dashboard {
            display: flex;
            gap: 15px;
            background: var(--panel-bg);
            backdrop-filter: blur(8px);
            padding: 12px 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.08);
            flex-wrap: wrap;
            justify-content: center;
        }

        .stat-box { font-size: 15px; font-weight: bold; }
        .stat-box span { color: var(--primary); text-shadow: 0 0 5px var(--primary-glow); }
        .stat-box span.coins { color: var(--gold); text-shadow: 0 0 5px rgba(241, 196, 15, 0.4); }

        .controls-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            align-items: center;
        }

        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1100px;
        }

        .game-wrapper {
            position: relative;
        }

        /* Játéktér szegély és fémes keret */
        canvas {
            border: 4px solid #2a2e39;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 15px rgba(0,0,0,0.5);
            border-radius: 10px;
            transition: transform 0.05s ease-in-out;
            display: block;
        }

        canvas.shake-wall {
            animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both;
            border-color: #ff2a2a;
            box-shadow: 0 0 20px rgba(255, 42, 42, 0.6);
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-3px, 0, 0); }
            20%, 80% { transform: translate3d(5px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        /* Közös Overlay stílusok (Game Over és Név Módosító) */
        .overlay-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 12, 16, 0.9);
            backdrop-filter: blur(6px);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 10;
            padding: 20px;
            box-sizing: border-box;
        }

        .overlay-panel.show {
            opacity: 1;
            pointer-events: auto;
        }

        .overlay-title {
            font-size: 26px;
            color: #ff4757;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 71, 87, 0.5);
        }

        .overlay-title.name-title {
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary-glow);
        }

        .overlay-sub {
            font-size: 15px;
            color: #ccc;
            margin-bottom: 15px;
            text-align: center;
        }

        /* Névbeviteli Mező */
        .name-input {
            background: #13161c;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            padding: 10px 15px;
            color: #fff;
            font-size: 16px;
            text-align: center;
            outline: none;
            margin-bottom: 15px;
            width: 80%;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
            transition: border-color 0.2s;
        }

        .name-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 8px var(--primary-glow);
        }

        .overlay-buttons {
            display: flex;
            gap: 10px;
        }

        .panel-column {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 320px;
        }

        .accordion-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(8px);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .accordion-header {
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 15px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            transition: background 0.2s;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .accordion-header:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .accordion-content {
            padding: 15px;
            display: none;
        }

        .accordion-panel.open .accordion-content {
            display: block;
        }

        .accordion-panel.open .arrow {
            transform: rotate(180deg);
        }

        .arrow {
            transition: transform 0.3s;
            font-size: 12px;
        }

        /* Textúrázott Kártyák 3D hatással */
        .bp-card, .quest-card, .shop-card, .leaderboard-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0.2) 100%);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #555;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 2px 5px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05);
            border-left-width: 4px;
        }

        .bp-card.unlocked { border-left-color: var(--primary); }
        .bp-card.active { border: 1px solid var(--primary); box-shadow: 0 0 10px var(--primary-glow); }
        .shop-card { border-left-color: var(--gold); }
        .quest-card.completed { border-left-color: var(--gold); opacity: 0.7; }
        .leaderboard-card { border-left-color: #3498db; }
        .leaderboard-card.top1 { border-left-color: var(--gold); background: linear-gradient(135deg, rgba(241, 196, 15, 0.15) 0%, rgba(0,0,0,0.3) 100%); }

        /* Gombok Gradienssel és Fény-effekttel */
        .btn {
            background: linear-gradient(180deg, #4CAF50 0%, #388E3C 100%);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.3);
            transition: all 0.2s;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 5px 12px rgba(76, 175, 80, 0.4), inset 0 1px 0 rgba(255,255,255,0.4);
        }

        .btn-shop { 
            background: linear-gradient(180deg, #f39c12 0%, #d35400 100%);
        }
        .btn-shop:hover:not(:disabled) {
            box-shadow: 0 5px 12px rgba(243, 156, 18, 0.4);
        }

        .btn-cancel {
            background: linear-gradient(180deg, #7f8c8d 0%, #34495e 100%);
        }

        .btn-diff {
            background: #252932;
            color: #aaa;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 6px 12px;
            box-shadow: none;
        }

        .btn-diff.active {
            background: linear-gradient(180deg, #4CAF50 0%, #388E3C 100%);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .btn:disabled {
            background: #333;
            color: #777;
            box-shadow: none;
            cursor: not-allowed;
        }

        .color-preview {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: inline-block;
            vertical-align: middle;
            margin-right: 6px;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.3);
        }

        .active-buffs {
            font-size: 13px;
            color: var(--accent);
            margin-top: 5px;
            text-shadow: 0 0 5px rgba(0, 210, 211, 0.4);
        }
    </style>
</head>
<body>

    <h1>🐍 Snake Deluxe</h1>
    <div class="player-tag">Játékos: <span id="playerNameDisplay" onclick="openNameOverlay()">Játékos</span> ✏️</div>

    <div class="dashboard">
        <div class="stat-box">Pontszám: <span id="score">0</span></div>
        <div class="stat-box">Érmék: 🪙 <span id="coins" class="coins">0</span></div>
        <div class="stat-box">Rekord: <span id="highScore">0</span></div>
        <div class="stat-box">Összes XP: <span id="totalXp">0</span></div>
        <div class="stat-box">BP Szint: <span id="bpLevel">1</span></div>
    </div>

    <div class="controls-bar">
        <span>Nehézség:</span>
        <button class="btn btn-diff active" id="btn-easy" onclick="setDifficulty('easy')">Könnyű</button>
        <button class="btn btn-diff" id="btn-medium" onclick="setDifficulty('medium')">Közepes</button>
        <button class="btn btn-diff" id="btn-hard" onclick="setDifficulty('hard')">Nehéz</button>
    </div>

    <div class="container">
        <div class="game-wrapper">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            
            <!-- Game Over Overlay -->
            <div class="overlay-panel" id="gameOverOverlay">
                <div class="overlay-title">JÁTÉK VÉGE!</div>
                <div class="overlay-sub" id="gameOverText">Pontszám: 0</div>
                <button class="btn" onclick="restartGame()">Újrajáték 🔄</button>
            </div>

            <!-- Név Módosító Overlay (Közvetlenül a vásznon) -->
            <div class="overlay-panel" id="nameOverlay">
                <div class="overlay-title name-title">👤 JÁTÉKOSNÉV</div>
                <div class="overlay-sub">Add meg az új nevedet a dicsőségtáblához:</div>
                <input type="text" id="nameInput" class="name-input" maxlength="15" placeholder="Írd be a neved...">
                <div class="overlay-buttons">
                    <button class="btn btn-cancel" onclick="closeNameOverlay()">Mégse</button>
                    <button class="btn" onclick="saveNameFromOverlay()">Mentés ✨</button>
                </div>
            </div>
        </div>

        <div class="panel-column">
            
            <div class="accordion-panel open" id="panel-leaderboard">
                <div class="accordion-header" onclick="toggleAccordion('panel-leaderboard')">
                    <span>🏆 Dicsőségtábla (Leaderboard)</span>
                    <span class="arrow">▼</span>
                </div>
                <div class="accordion-content">
                    <div id="leaderboardList"></div>
                </div>
            </div>

            <div class="accordion-panel" id="panel-quests">
                <div class="accordion-header" onclick="toggleAccordion('panel-quests')">
                    <span>📜 Napi Küldetések</span>
                    <span class="arrow">▼</span>
                </div>
                <div class="accordion-content">
                    <div id="questList"></div>
                </div>
            </div>

            <div class="accordion-panel" id="panel-bp">
                <div class="accordion-header" onclick="toggleAccordion('panel-bp')">
                    <span>🎨 BP Skinek</span>
                    <span class="arrow">▼</span>
                </div>
                <div class="accordion-content">
                    <div id="bpList"></div>
                </div>
            </div>

            <div class="accordion-panel" id="panel-shop">
                <div class="accordion-header" onclick="toggleAccordion('panel-shop')">
                    <span>🛒 Bolt (Shop)</span>
                    <span class="arrow">▼</span>
                </div>
                <div class="accordion-content">
                    <div id="shopList"></div>
                    <div class="active-buffs" id="activeBuffsText"></div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // Játékos név kezelése
        let playerName = localStorage.getItem("snake_playerName") || "Játékos";

        function openNameOverlay() {
            const input = document.getElementById("nameInput");
            input.value = playerName;
            document.getElementById("nameOverlay").classList.add("show");
            setTimeout(() => input.focus(), 100);
        }

        function closeNameOverlay() {
            document.getElementById("nameOverlay").classList.remove("show");
        }

        function saveNameFromOverlay() {
            const input = document.getElementById("nameInput");
            const newName = input.value.trim();
            if (newName !== "") {
                playerName = newName;
                localStorage.setItem("snake_playerName", playerName);
                updateUI();
            }
            closeNameOverlay();
        }

        // Enter gombra mentés a név overlay-en
        document.getElementById("nameInput").addEventListener("keyup", function(e) {
            if (e.key === "Enter") {
                saveNameFromOverlay();
            }
        });

        // Állapotok & Mentés
        let score = 0;
        let coins = parseInt(localStorage.getItem("snake_coins")) || 0;
        let highScore = localStorage.getItem("snake_highScore") || 0;
        let totalXp = parseInt(localStorage.getItem("snake_totalXp")) || 0;
        let activeSkin = localStorage.getItem("snake_activeSkin") || "#4CAF50";
        let ownedSkins = JSON.parse(localStorage.getItem("snake_ownedSkins")) || ["#4CAF50"];
        let leaderboard = JSON.parse(localStorage.getItem("snake_leaderboard")) || [
            { name: "ProSnake", score: 120 },
            { name: "Slayer99", score: 80 },
            { name: "NoobMaster", score: 30 }
        ];

        let hasShield = false;
        let doubleCoinsActive = false;
        let doubleCoinsTimer = null;

        let speed = 120;
        let difficulty = "easy";
        let isSlowed = false;
        let slowTimer = null;
        let isGameOver = false;

        let applesEatenSession = 0;
        let q1Done = localStorage.getItem("snake_q1") === "true";
        let q2Done = localStorage.getItem("snake_q2") === "true";

        const bpSkins = [
            { id: 1, name: "Alap Zöld", color: "#4CAF50", reqLvl: 1 },
            { id: 2, name: "Neon Kék", color: "#00d2d3", reqLvl: 2 },
            { id: 3, name: "Mágikus Lila", color: "#a29bfe", reqLvl: 4 },
            { id: 4, name: "Arany Kígyó", color: "#f1c40f", reqLvl: 6 },
            { id: 5, name: "Sárkány Pikkely", color: "#e74c3c", reqLvl: 8 }
        ];

        const shopItems = [
            { id: "shield", name: "🛡️ Pajzs (Extra Élet)", type: "consumable", price: 150, desc: "Megvéd 1 ütközéstől" },
            { id: "double", name: "🪙 Dupla Érme (30 mp)", type: "consumable", price: 100, desc: "2x érme almákért" },
            { id: "pink", name: "🌸 Cseresznyevirág", type: "skin", color: "#ff79c6", price: 200, desc: "Rózsaszín skin" },
            { id: "galaxy", name: "🌌 Galaxis Skin", type: "skin", color: "#6c5ce7", price: 350, desc: "Sötétlila skin" }
        ];

        let snake = [{ x: 10, y: 10 }];
        let dx = 0, dy = 0;

        let normalFood = { x: 15, y: 15 };
        let specialFood = null;
        let obstacles = [];
        let particles = [];

        function toggleAccordion(panelId) {
            const panel = document.getElementById(panelId);
            panel.classList.toggle("open");
        }

        function getBpLevel() {
            return Math.floor(totalXp / 50) + 1;
        }

        function setDifficulty(diff) {
            difficulty = diff;
            document.querySelectorAll('.btn-diff').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${diff}`).classList.add('active');

            if (diff === 'easy') speed = 120;
            if (diff === 'medium') speed = 90;
            if (diff === 'hard') speed = 65;

            resetGame();
        }

        function triggerWallCrash(headX, headY) {
            canvas.classList.add("shake-wall");
            setTimeout(() => {
                canvas.classList.remove("shake-wall");
            }, 300);

            const px = Math.min(Math.max(headX, 0), tileCount - 1) * gridSize + gridSize / 2;
            const py = Math.min(Math.max(headY, 0), tileCount - 1) * gridSize + gridSize / 2;

            for (let i = 0; i < 25; i++) {
                particles.push({
                    x: px,
                    y: py,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    color: Math.random() < 0.5 ? activeSkin : '#ff2a2a',
                    size: Math.random() * 5 + 2,
                    alpha: 1
                });
            }
        }

        function drawParticles() {
            particles.forEach((p, index) => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.04;

                if (p.alpha <= 0) {
                    particles.splice(index, 1);
                }
            });
        }

        // --- Pálya Kő/Grid Textúrájának kirajzolása ---
        function drawBackground() {
            ctx.fillStyle = "#11141a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Finom négyzetháló / kő csempe minta
            ctx.strokeStyle = "rgba(255, 255, 255, 0.03)";
            ctx.lineWidth = 1;
            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }
        }

        // --- Akadályok Tégla Textúrája ---
        function drawObstacle(x, y) {
            const px = x * gridSize;
            const py = y * gridSize;

            ctx.fillStyle = "#a83232";
            ctx.fillRect(px, py, gridSize, gridSize);

            ctx.fillStyle = "#d64545";
            ctx.fillRect(px + 1, py + 1, gridSize - 2, 8);
            ctx.fillRect(px + 1, py + 10, gridSize - 2, 8);

            ctx.strokeStyle = "#5e1919";
            ctx.lineWidth = 1;
            ctx.strokeRect(px + 0.5, py + 0.5, gridSize - 1, gridSize - 1);
            ctx.beginPath();
            ctx.moveTo(px + 10, py + 1); ctx.lineTo(px + 10, py + 9);
            ctx.moveTo(px + 5, py + 10); ctx.lineTo(px + 5, py + 18);
            ctx.stroke();
        }

        // --- Részletes Alma Rajzoló ---
        function drawApple(gx, gy, colorMain, colorDark) {
            const cx = gx * gridSize + gridSize / 2;
            const cy = gy * gridSize + gridSize / 2 + 1;
            const r = gridSize / 2 - 2;

            ctx.save();

            ctx.fillStyle = colorMain;
            ctx.beginPath();
            ctx.arc(cx - r * 0.35, cy - r * 0.1, r * 0.75, 0, Math.PI * 2);
            ctx.arc(cx + r * 0.35, cy - r * 0.1, r * 0.75, 0, Math.PI * 2);
            ctx.arc(cx, cy + r * 0.2, r * 0.7, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = colorDark;
            ctx.beginPath();
            ctx.arc(cx, cy + r * 0.4, r * 0.45, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
            ctx.beginPath();
            ctx.arc(cx - r * 0.35, cy - r * 0.3, r * 0.25, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = "#5c3a21";
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.moveTo(cx, cy - r * 0.5);
            ctx.quadraticCurveTo(cx + 2, cy - r * 1.1, cx + 4, cy - r * 1.2);
            ctx.stroke();

            ctx.fillStyle = "#2ed573";
            ctx.beginPath();
            ctx.ellipse(cx + 3, cy - r * 0.9, 3.5, 1.8, Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function generateObstacles() {
            obstacles = [];
            let count = 0;
            if (difficulty === "medium") count = 3;
            if (difficulty === "hard") count = 7;

            for (let i = 0; i < count; i++) {
                let ox, oy;
                do {
                    ox = Math.floor(Math.random() * tileCount);
                    oy = Math.floor(Math.random() * tileCount);
                } while ((ox === 10 && oy === 10) || (ox === normalFood.x && oy === normalFood.y));
                obstacles.push({ x: ox, y: oy });
            }
        }

        function generateSpecialFood() {
            if (Math.random() < 0.3) {
                const type = Math.random() < 0.5 ? 'gold' : 'lightning';
                let sx, sy;
                do {
                    sx = Math.floor(Math.random() * tileCount);
                    sy = Math.floor(Math.random() * tileCount);
                } while (obstacles.some(o => o.x === sx && o.y === sy));
                specialFood = { x: sx, y: sy, type: type };
            } else {
                specialFood = null;
            }
        }

        function saveToLeaderboard(name, finalScore) {
            if (finalScore <= 0) return;
            const existingUserIndex = leaderboard.findIndex(entry => entry.name === name);
            if (existingUserIndex !== -1) {
                if (finalScore > leaderboard[existingUserIndex].score) {
                    leaderboard[existingUserIndex].score = finalScore;
                }
            } else {
                leaderboard.push({ name: name, score: finalScore });
            }
            leaderboard.sort((a, b) => b.score - a.score);
            leaderboard = leaderboard.slice(0, 5);
            localStorage.setItem("snake_leaderboard", JSON.stringify(leaderboard));
        }

        function handleGameOver() {
            isGameOver = true;
            saveToLeaderboard(playerName, score);
            
            document.getElementById("gameOverText").innerText = `${playerName}, szerzett pontod: ${score}`;
            setTimeout(() => {
                document.getElementById("gameOverOverlay").classList.add("show");
            }, 300);
        }

        function restartGame() {
            document.getElementById("gameOverOverlay").classList.remove("show");
            resetGame();
        }

        function updateUI() {
            document.getElementById("playerNameDisplay").innerText = playerName;
            document.getElementById("score").innerText = score;
            document.getElementById("coins").innerText = coins;
            document.getElementById("highScore").innerText = highScore;
            document.getElementById("totalXp").innerText = totalXp;
            document.getElementById("bpLevel").innerText = getBpLevel();

            let buffText = "";
            if (hasShield) buffText += "🛡️ Pajzs aktív! ";
            if (doubleCoinsActive) buffText += "🪙 2x Érme aktív!";
            document.getElementById("activeBuffsText").innerText = buffText;

            renderLeaderboard();
            renderBP();
            renderQuests();
            renderShop();
        }

        function renderLeaderboard() {
            const list = document.getElementById("leaderboardList");
            list.innerHTML = "";

            leaderboard.forEach((entry, index) => {
                const card = document.createElement("div");
                card.className = `leaderboard-card ${index === 0 ? 'top1' : ''}`;
                card.innerHTML = `
                    <div>
                        <strong>#${index + 1} ${entry.name}</strong>
                    </div>
                    <strong>${entry.score} pont</strong>
                `;
                list.appendChild(card);
            });
        }

        function renderQuests() {
            const list = document.getElementById("questList");
            list.innerHTML = `
                <div class="quest-card ${q1Done ? 'completed' : ''}">
                    <div>
                        <strong>Egyél meg 5 almát</strong><br>
                        <small>Jelenleg: ${applesEatenSession}/5 | Jutalom: +50 XP, +20 🪙</small>
                    </div>
                    <span>${q1Done ? '✓' : '🎁'}</span>
                </div>
                <div class="quest-card ${q2Done ? 'completed' : ''}">
                    <div>
                        <strong>Érj el 50 pontot</strong><br>
                        <small>Jutalom: +100 XP, +50 🪙</small>
                    </div>
                    <span>${q2Done ? '✓' : '🎁'}</span>
                </div>
            `;
        }

        function renderBP() {
            const list = document.getElementById("bpList");
            const currentLvl = getBpLevel();
            list.innerHTML = "";

            bpSkins.forEach(skin => {
                const unlocked = currentLvl >= skin.reqLvl;
                const isActive = activeSkin === skin.color;

                const card = document.createElement("div");
                card.className = `bp-card ${unlocked ? 'unlocked' : ''} ${isActive ? 'active' : ''}`;
                
                card.innerHTML = `
                    <div>
                        <span class="color-preview" style="background:${skin.color}"></span>
                        <strong>${skin.name}</strong><br>
                        <small>BP Lvl ${skin.reqLvl}</small>
                    </div>
                    <button class="btn" ${!unlocked ? 'disabled' : ''} onclick="selectSkin('${skin.color}')">
                        ${isActive ? 'Használatban' : (unlocked ? 'Választ' : 'Zárt')}
                    </button>
                `;
                list.appendChild(card);
            });
        }

        function renderShop() {
            const list = document.getElementById("shopList");
            list.innerHTML = "";

            shopItems.forEach(item => {
                const card = document.createElement("div");
                card.className = "shop-card";

                let buttonHtml = "";

                if (item.type === "skin") {
                    const isBought = ownedSkins.includes(item.color);
                    const isActive = activeSkin === item.color;

                    if (isActive) {
                        buttonHtml = `<button class="btn" disabled>Használatban</button>`;
                    } else if (isBought) {
                        buttonHtml = `<button class="btn" onclick="selectSkin('${item.color}')">Választ</button>`;
                    } else {
                        buttonHtml = `<button class="btn btn-shop" ${coins < item.price ? 'disabled' : ''} onclick="buyItem('${item.id}')">Vétel (${item.price}🪙)</button>`;
                    }
                } else {
                    buttonHtml = `<button class="btn btn-shop" ${coins < item.price ? 'disabled' : ''} onclick="buyItem('${item.id}')">Vétel (${item.price}🪙)</button>`;
                }

                card.innerHTML = `
                    <div>
                        ${item.color ? `<span class="color-preview" style="background:${item.color}"></span>` : ''}
                        <strong>${item.name}</strong><br>
                        <small>${item.desc}</small>
                    </div>
                    ${buttonHtml}
                `;
                list.appendChild(card);
            });
        }

        function buyItem(itemId) {
            const item = shopItems.find(i => i.id === itemId);
            if (!item || coins < item.price) return;

            coins -= item.price;
            localStorage.setItem("snake_coins", coins);

            if (item.id === "shield") {
                hasShield = true;
            } else if (item.id === "double") {
                doubleCoinsActive = true;
                clearTimeout(doubleCoinsTimer);
                doubleCoinsTimer = setTimeout(() => {
                    doubleCoinsActive = false;
                    updateUI();
                }, 30000);
            } else if (item.type === "skin") {
                ownedSkins.push(item.color);
                activeSkin = item.color;
                localStorage.setItem("snake_ownedSkins", JSON.stringify(ownedSkins));
                localStorage.setItem("snake_activeSkin", activeSkin);
            }

            updateUI();
        }

        function selectSkin(color) {
            activeSkin = color;
            localStorage.setItem("snake_activeSkin", color);
            updateUI();
        }

        function checkQuests() {
            if (!q1Done && applesEatenSession >= 5) {
                q1Done = true;
                totalXp += 50;
                coins += 20;
                localStorage.setItem("snake_q1", "true");
            }
            if (!q2Done && score >= 50) {
                q2Done = true;
                totalXp += 100;
                coins += 50;
                localStorage.setItem("snake_q2", "true");
            }
            localStorage.setItem("snake_totalXp", totalXp);
            localStorage.setItem("snake_coins", coins);
        }

        // --- BILLENTYŰZET IRÁNYÍTÁS (Nyilak + WASD) ---
        document.addEventListener("keydown", (e) => {
            // Ha épp nevet ír be az overlay-en, ne mozgassa a kígyót
            if (document.activeElement.id === "nameInput") return;
            if (isGameOver) return;

            const key = e.key.toLowerCase();

            if ((key === "arrowup" || key === "w") && dy === 0) { 
                dx = 0; dy = -1; 
            }
            if ((key === "arrowdown" || key === "s") && dy === 0) { 
                dx = 0; dy = 1; 
            }
            if ((key === "arrowleft" || key === "a") && dx === 0) { 
                dx = -1; dy = 0; 
            }
            if ((key === "arrowright" || key === "d") && dx === 0) { 
                dx = 1; dy = 0; 
            }
        });

        function resetGame() {
            snake = [{ x: 10, y: 10 }];
            dx = 0; dy = 0;
            score = 0;
            applesEatenSession = 0;
            isSlowed = false;
            isGameOver = false;
            particles = [];
            generateObstacles();
            generateSpecialFood();
            updateUI();
        }

        function gameLoop() {
            if (!isGameOver && (dx !== 0 || dy !== 0)) {
                const head = { x: snake[0].x + dx, y: snake[0].y + dy };

                const hitWall = head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount;
                const hitSelf = snake.some((part, i) => i !== 0 && part.x === head.x && part.y === head.y);
                const hitObstacle = obstacles.some(o => o.x === head.x && o.y === head.y);

                if (hitWall || hitSelf || hitObstacle) {
                    if (hitWall) {
                        triggerWallCrash(head.x, head.y);
                    }

                    if (hasShield) {
                        hasShield = false;
                        updateUI();
                    } else {
                        handleGameOver();
                    }
                } else {
                    snake.unshift(head);

                    const earnedCoinMult = doubleCoinsActive ? 2 : 1;

                    if (head.x === normalFood.x && head.y === normalFood.y) {
                        score += 10;
                        totalXp += 10;
                        coins += 5 * earnedCoinMult;
                        applesEatenSession++;
                        if (score > highScore) highScore = score;

                        localStorage.setItem("snake_highScore", highScore);
                        localStorage.setItem("snake_totalXp", totalXp);
                        localStorage.setItem("snake_coins", coins);

                        normalFood.x = Math.floor(Math.random() * tileCount);
                        normalFood.y = Math.floor(Math.random() * tileCount);

                        generateSpecialFood();
                        checkQuests();
                        updateUI();
                    } 
                    else if (specialFood && head.x === specialFood.x && head.y === specialFood.y) {
                        if (specialFood.type === 'gold') {
                            score += 30;
                            totalXp += 30;
                            coins += 15 * earnedCoinMult;
                        } else if (specialFood.type === 'lightning') {
                            isSlowed = true;
                            clearTimeout(slowTimer);
                            slowTimer = setTimeout(() => { isSlowed = false; }, 5000);
                        }
                        specialFood = null;
                        localStorage.setItem("snake_totalXp", totalXp);
                        localStorage.setItem("snake_coins", coins);
                        checkQuests();
                        updateUI();
                    } else {
                        snake.pop();
                    }
                }
            }

            // Pálya és Grid rajzolása
            drawBackground();

            // Akadályok
            obstacles.forEach(o => drawObstacle(o.x, o.y));

            // Piros alma rajzolása
            drawApple(normalFood.x, normalFood.y, "#ff3838", "#c0392b");

            // Speciális étel (Arany alma vagy Kék villám)
            if (specialFood) {
                if (specialFood.type === 'gold') {
                    drawApple(specialFood.x, specialFood.y, "#f1c40f", "#d35400");
                } else {
                    ctx.fillStyle = '#00d2d3';
                    ctx.beginPath();
                    ctx.arc(specialFood.x * gridSize + gridSize/2, specialFood.y * gridSize + gridSize/2, gridSize/2 - 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Kígyó rajzolása (Enyhe Neon Glow effekttel)
            ctx.save();
            ctx.shadowColor = activeSkin;
            ctx.shadowBlur = 8;

            snake.forEach((part, index) => {
                const x = part.x * gridSize;
                const y = part.y * gridSize;

                if (index === 0) {
                    ctx.fillStyle = activeSkin;
                    ctx.beginPath();
                    ctx.roundRect(x + 1, y + 1, gridSize - 2, gridSize - 2, 8);
                    ctx.fill();

                    if (hasShield) {
                        ctx.strokeStyle = "#00d2d3";
                        ctx.lineWidth = 2;
                        ctx.strokeRect(x, y, gridSize, gridSize);
                    }

                    // Szemek
                    ctx.fillStyle = "#fff";
                    let eyeX1 = x + 5, eyeY1 = y + 5, eyeX2 = x + 15, eyeY2 = y + 5;
                    if (dx === 1) { eyeX1 = x + 13; eyeX2 = x + 13; eyeY1 = y + 4; eyeY2 = y + 14; }
                    if (dx === -1) { eyeX1 = x + 5; eyeX2 = x + 5; eyeY1 = y + 4; eyeY2 = y + 14; }
                    if (dy === 1) { eyeX1 = x + 4; eyeX2 = x + 14; eyeY1 = y + 13; eyeY2 = y + 13; }
                    if (dy === -1) { eyeX1 = x + 4; eyeX2 = x + 14; eyeY1 = y + 5; eyeY2 = y + 5; }

                    ctx.beginPath();
                    ctx.arc(eyeX1, eyeY1, 2.5, 0, Math.PI * 2);
                    ctx.arc(eyeX2, eyeY2, 2.5, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = "#000";
                    ctx.beginPath();
                    ctx.arc(eyeX1, eyeY1, 1, 0, Math.PI * 2);
                    ctx.arc(eyeX2, eyeY2, 1, 0, Math.PI * 2);
                    ctx.fill();

                    // Nyelv
                    if (dx !== 0 || dy !== 0) {
                        ctx.fillStyle = "#ff2a2a";
                        ctx.beginPath();
                        if (dx === 1) ctx.fillRect(x + gridSize, y + 8, 4, 3);
                        if (dx === -1) ctx.fillRect(x - 4, y + 8, 4, 3);
                        if (dy === 1) ctx.fillRect(x + 8, y + gridSize, 3, 4);
                        if (dy === -1) ctx.fillRect(x + 8, y - 4, 3, 4);
                        ctx.fill();
                    }
                } else {
                    ctx.fillStyle = activeSkin;
                    ctx.beginPath();
                    ctx.arc(x + gridSize/2, y + gridSize/2, (gridSize/2) - 1, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            ctx.restore();

            // Ütközési részecskék frissítése és rajzolása
            drawParticles();

            const currentSpeed = isSlowed ? speed + 60 : speed;
            setTimeout(gameLoop, currentSpeed);
        }

        resetGame();
        gameLoop();
    </script>
</body>
</html>
